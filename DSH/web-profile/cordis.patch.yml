- id: desktop-shell
  name: dsh-plugin-desktop
  config:
    mode: compatibility
    openBrowser: true
    networkExposure: loopback
    developerLogging: true
    logLevel: warn
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: standard
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      apig:
        displayName: 小猪窝
        apiKeyEnv: APIG_API_KEY
        api: openai-responses
        baseURL: https://oinkie.top
        defaultInput:
          - text
          - image
        reasoning: medium
        models:
          # 网关别名，无官方 id
          - id: codex-auto-review
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # 无 minimal
          - id: gpt-5.6-sol
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # 无 off（400）
          - id: gpt-6-astra
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # 无 minimal
          - id: gpt-6-sol
            input:
              - text
              - image
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # 无 none / minimal
          - id: gpt-6.1-sol
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # 无 off
          - id: grok-4.7
            name: Grok 4.7
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: grok-4.6
            name: Grok 4.6
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
      # 走 Messages API，继承 adaptive thinking
      anthropic:
        displayName: 小猪窝 · Claude
        apiKeyEnv: APIG_API_KEY
        baseURL: https://oinkie.top
        defaultInput:
          - text
          - image
        reasoning: medium
        models:
          # 无 off（400）
          - id: claude-opus-5-5
            name: claude-opus-5-5
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # 无 off / minimal
          - id: claude-sonnet-5-5
            name: claude-sonnet-5-5
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # 预算式 thinking，无 thinkingLevelMap
          - id: claude-sonnet-4-5-20250929
            name: claude-sonnet-4-5-20250929
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              minimal: minimal
              low: low
              medium: medium
              high: high
      # 不写 api 才复用官方路由
      google:
        displayName: 小猪窝 · Gemini
        apiKeyEnv: APIG_API_KEY
        baseURL: https://oinkie.top/v1beta
        defaultInput:
          - text
          - image
        reasoning: medium
        models:
          - id: gemini-4-argon
            name: gemini-4-argon
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          # 官方无此 id，按三档填
          - id: gemini-4-argon-high
            name: gemini-4-argon-high
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
      # 请求 id 为 deepseek-flash；off 发 type=disabled
      deepseek:
        displayName: 小猪窝 · DeepSeek
        apiKeyEnv: APIG_API_KEY
        baseURL: https://oinkie.top
        defaultInput:
          - text
          - image
        reasoning: medium
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            input:
              - text
              - image
            compat:
              thinkingFormat: deepseek
              supportsReasoningEffort: true
              requiresReasoningContentOnAssistantMessages: true
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              max: max
      # 仅 low / high / max，思考强制
      zai:
        displayName: 小猪窝 · GLM
        apiKeyEnv: APIG_API_KEY
        api: openai-completions
        baseURL: https://oinkie.top/v1
        defaultInput:
          - text
          - image
        reasoning: medium
        models:
          - id: glm-5.3-flash
            name: glm-5.3-flash
            input:
              - text
              - image
            compat:
              thinkingFormat: zai
              supportsReasoningEffort: true
            reasoningEfforts:
              low: low
              medium: high
              high: high
              max: max
      # 路由名决定思考格式
      moonshotai:
        displayName: 小猪窝 · Kimi
        apiKeyEnv: APIG_API_KEY
        baseURL: https://oinkie.top/v1
        defaultInput:
          - text
          - image
        reasoning: medium
        models:
          - id: kimi-k3
            name: kimi-k3
            input:
              - text
              - image
            compat:
              thinkingFormat: openai
              supportsReasoningEffort: true
              requiresReasoningContentOnAssistantMessages: true
            reasoningEfforts:
              low: low
              medium: high
              high: high
              max: max
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek
    model: deepseek-v4.1-flash
    reasoningEffort: medium
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
    fontSize: 14
- id: desktop-notifications
  name: dsh-plugin-desktop/notifications
  config:
    enabled: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: auto-continue
  name: dsh-client-auto-continue
  config:
    locale: zh
    sessionModes:
      session-690515e0-247c-41b9-8fe4-2e5bd370d54b: recover
      session-dab052b3-aedb-48ba-b2cc-bc9d25b3f28f: recover
- id: codex-subscription
  name: dsh-codex-subscription
  config:
    connectionMode: websocket
    quickQuotaMode: bar
    searchProvider: codex
    outputVerbosity: high
    reasoningSummary: detailed
    retryPolicy: "10"
    connectors: ask
    inputImageDetail: original
    imageSketch: true
    quotaAlerts: off
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    agentOpenTools: true
- id: remote-web-ui
  name: "@linxin666/dsh-remote-web-ui"
  config:
    autoTunnel: true
    publicBaseUrl: https://oinkie.top
  disabled: true
- id: deepseek-usage
  name: "@dougen/dsh-deepseek-usage"
  disabled: true
- id: deepseek-usage
  disabled: true

- id: import-claude
  name: dsh-chat-import
  disabled: true
- id: dsh-browser
  config:
    chromePath: /Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge
    # 免审批取驱动权
    askOnAcquire: false
    # 加载时同步扩展产物；重载仍需在扩展页手动点
    installHostAutomatically: true
