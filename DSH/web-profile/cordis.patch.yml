# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: desktop-shell
  name: dsh-plugin-desktop
  config:
    mode: compatibility
    openBrowser: true
    networkExposure: loopback
    developerLogging: true
    logLevel: warn
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: standard
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      apig:
        displayName: 小猪窝
        apiKeyEnv: APIG_API_KEY
        api: openai-responses
        baseURL: https://oinkie.top
        defaultInput:
          - text
          - image
        models:
          - id: codex-auto-review
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-5.6-sol
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-6-astra
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-6-sol
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-6.1-sol
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: grok-4.7
            name: Grok 4.7
            input:
              - text
              - image
          - id: grok-4.6
            name: Grok 4.6
            input:
              - text
              - image
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            input:
              - text
              - image
          - id: glm-5.3-flash
            name: glm-5.3-flash
            input:
              - text
              - image
          - id: kimi-k3
            name: kimi-k3
            input:
              - text
              - image
          - id: claude-opus-5-5
            name: claude-opus-5-5
            input:
              - text
              - image
          - id: claude-sonnet-4-5-20250929
            name: claude-sonnet-4-5-20250929
            input:
              - text
              - image
          - id: claude-sonnet-5-5
            name: claude-sonnet-5-5
            input:
              - text
              - image
          - id: gemini-4-argon
            name: gemini-4-argon
            input:
              - text
              - image
          - id: gemini-4-argon-high
            name: gemini-4-argon-high
            input:
              - text
              - image
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: apig
    model: grok-4.7
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
    fontSize: 14
- id: desktop-notifications
  name: dsh-plugin-desktop/notifications
  config:
    enabled: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: auto-continue
  name: dsh-client-auto-continue
  config:
    sessionModes:
      session-690515e0-247c-41b9-8fe4-2e5bd370d54b: recover
      session-dab052b3-aedb-48ba-b2cc-bc9d25b3f28f: recover
- id: codex-subscription
  name: dsh-codex-subscription
  config:
    connectionMode: websocket
    quickQuotaMode: bar
    searchProvider: codex
    outputVerbosity: high
    reasoningSummary: detailed
    retryPolicy: "10"
    connectors: ask
    inputImageDetail: original
    imageSketch: true
    quotaAlerts: off
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    agentOpenTools: true
- id: remote-web-ui
  name: "@linxin666/dsh-remote-web-ui"
  config:
    autoTunnel: true
    publicBaseUrl: https://oinkie.top
  disabled: true
- id: deepseek-usage
  name: "@dougen/dsh-deepseek-usage"
  disabled: true
- id: deepseek-usage
  disabled: false
