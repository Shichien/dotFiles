# ============ tmux 配置：Catppuccin Mocha + powerline 状态栏 ============

# 前缀键改成 Ctrl-a（比默认 Ctrl-b 顺手）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 基础体验
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 窗口尺寸永远跟随真实终端尺寸。
# 不设的话，一次 resize-window -x/-y 就会把窗口钉死成固定宽高，
# 之后拉大终端时右侧会留出一条没人重绘的空隙（看着是一列点点）。
set -g window-size latest
set -g aggressive-resize on

# 窗口名自动跟随当前目录，而不是一律显示 zsh
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# 用 | 和 - 分屏，更直觉
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 真彩色
set -ag terminal-overrides ",xterm-256color:RGB"

# ---- 状态栏外观 ----
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 120
set -g window-status-separator ""

# 左侧：会话名，用 powerline 箭头收口
set -g status-left "#[fg=#cba6f7,bg=default]#[bg=#cba6f7,fg=#181825,bold] #S #[fg=#cba6f7,bg=default] "

# 窗口标签：当前窗口高亮成绿色块
setw -g window-status-format "#[fg=#313244,bg=default]#[bg=#313244,fg=#a6c8d8] #I #W #[fg=#313244,bg=default] "
setw -g window-status-current-format "#[fg=#a6e3a1,bg=default]#[bg=#a6e3a1,fg=#181825,bold] #I #W #[fg=#a6e3a1,bg=default] "

# 右侧：时间，前面加图标
set -g status-right "#[fg=#45475a,bg=default]#[bg=#45475a,fg=#89dceb] %Y-%m-%d #[bg=#45475a,fg=#f5c2e7,bold] %H:%M #[fg=#45475a,bg=default] "

# 窗格边框
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
# 上栏：每个窗格顶部显示一行标题（路径 + 编号）
set -g pane-border-status top
set -g pane-border-format "#[bg=#313244,fg=#cba6f7,bold] #{pane_index} #[bg=#313244,fg=#cdd6f4]#{b:pane_current_path} #[default]"
set -g pane-border-lines single

# 当前窗口不要 tmux 3.4 默认的下划线（我们已用绿色块区分）
setw -g window-status-current-style "default"
setw -g window-status-style "default"

# 消息与命令提示
set -g message-style "bg=#f9e2af,fg=#181825,bold"
set -g message-command-style "bg=#f9e2af,fg=#181825"

# 复制模式
setw -g mode-style "bg=#cba6f7,fg=#181825"

# ===== 状态栏上下留白 =====
# status 4 行：第 1、2 行空白 → 命令输出与状态栏之间留出空隙
#              第 3 行放实际内容
#              第 4 行空白 → 胶囊下方也有一点呼吸空间
# 空白行的底色用 default（跟随终端），配合 Ghostty 的透明背景，空隙是真正的"透过去"
set -g status 4
set -g status-format[0] "#[default]"
set -g status-format[1] "#[default]"
# 第 3 行沿用 tmux 内置的左中右布局模板（动态读取 status-left / 窗口列表 / status-right）
set -g status-format[2] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-format[3] "#[default]"

# ===== 窗口标题栏 =====
# 让 tmux 把自己的标题写到终端标题上，Ghostty 的标题栏就会显示这一串
# 内容：会话名 · 当前目录 · 当前前台命令（全部是 tmux 内置变量，不会额外 fork 进程）
set -g set-titles on
set -g set-titles-string "#W"
